spring.datasource.url=${SR_METADATA_URL}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.connectTimeout=4
spring.datasource.hikari.data-source-properties.socketTimeout=15
spring.jdbc.template.query-timeout=10s
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=none
rehearsal.registration-enabled=${SR_REGISTRATION_ENABLED:false}
rehearsal.execution-enabled=${SR_EXECUTION_ENABLED:false}
