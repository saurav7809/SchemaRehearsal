server.address=127.0.0.1
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.connection-timeout=10s
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=100
server.tomcat.accept-count=50
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${SR_METADATA_URL:jdbc:postgresql://127.0.0.1:5432/sr_metadata}
spring.datasource.username=sr_app
spring.datasource.password=${SR_APP_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=280KB
management.server.address=127.0.0.1
management.server.port=${SR_MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db,execution,metadataLease
rehearsal.execution-enabled=${SR_EXECUTION_ENABLED:true}
