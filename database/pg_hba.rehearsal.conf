# Install as the complete pg_hba.conf of the dedicated rehearsal cluster.
host all                   sr_exec_setup 127.0.0.1/32 scram-sha-256
host sr_control            sr_broker     127.0.0.1/32 scram-sha-256
host sr_fixture            sr_reader     127.0.0.1/32 scram-sha-256
host /^sr_run_[a-f0-9]{32}$ sr_worker     127.0.0.1/32 scram-sha-256
host all                   all           0.0.0.0/0    reject
host all                   all           ::/0         reject
